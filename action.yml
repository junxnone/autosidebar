name: update sidebar
description: "update the sidebar in docsify"
inputs:
  GITHUB_TOKEN:
    description: "secrets.GITHUB_TOKEN"
    required: true
  actor:
    description: "github.actor"
    required: true
  docs_path:
    description: "markdown documents path"
    required: true
    default: "docs"
  root_node:
    description: "root node for kg"
    required: true
    default: "root"
  push_branch:
    description: "Target branch name to push the index"
    required: true
    default: "gh-page"
  ref:
    description: "checkout-commit"
    required: true
    default: "main"
runs:
  using: "composite"
  steps:
  - uses: actions/checkout@v4
    with:
      repository: 'junxnone/autosidebar'
      path: 'script'
  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: '3.x'
      cache: 'pip'
  - name: Install dependencies
    shell: bash
    run: |
      python -m pip install --upgrade pip
      pip install -r script/requirements.txt
  - uses: actions/checkout@v4
    with:
      path: 'target'
      ref: ${{ inputs.ref }}
  - name: update sidebar and push
    shell: bash
    env:
      DOCS: ${{ inputs.docs_path }}
      BRANCH: ${{ inputs.push_branch }}
      ACTOR: ${{ inputs.actor }}
      TOKEN: ${{ inputs.GITHUB_TOKEN }}
      REPOSITORY: ${{ github.repository }}
      ROOT_NODE: ${{ inputs.root_node }}
    run: |
      cd target
      REMOTE="https://${TOKEN}@github.com/${REPOSITORY}"
      git config user.email "${ACTOR}@users.noreply.github.com"
      git config user.name "$ACTOR"
      SIDEBAR="$DOCS/_sidebar.md"
      NEW="$RUNNER_TEMP/_sidebar.new"
      # every run stamps the sidebar with the current time, so compare without that line
      # to tell a real content change from a pure re-stamp
      strip_stamp() { sed '/^<kbd><sub>@/d' "$1"; }
      for i in 1 2 3 4 5; do
        # writes hist.md and kg.json in place, sidebar to stdout
        python ../script/update_sidebar.py --path "$DOCS" --repo_name "$REPOSITORY" --rname "$ROOT_NODE" > "$NEW"
        if [ -f "$SIDEBAR" ] \
           && diff -q <(strip_stamp "$NEW") <(strip_stamp "$SIDEBAR") > /dev/null \
           && git diff --quiet -- "$DOCS/hist.md" "$DOCS/kg.json"; then
          echo "docs unchanged, nothing to push"
          exit 0
        fi
        cp "$NEW" "$SIDEBAR"
        git add "$DOCS"
        git status
        if ! git commit -m "Update _sidebar"; then
          echo "nothing to commit"
          exit 0
        fi
        if git push "$REMOTE" "HEAD:$BRANCH"; then
          exit 0
        fi
        echo "push rejected (attempt $i), fetching latest $BRANCH and retrying..."
        git fetch "$REMOTE" "$BRANCH"
        git checkout -B "$BRANCH" FETCH_HEAD
        sleep $((i * 3))
      done
      echo "::error::push to $BRANCH failed after retries"
      exit 1
