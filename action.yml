name: update sidebar
description: "update the sidebar in docsify"
inputs:
  GITHUB_TOKEN:
    description: "secrets.GITHUB_TOKEN"
    required: true
  actor:
    description: "github.actor"
    required: true
  docs_path:
    description: "markdown documents path"
    required: true
    default: "docs"
  root_node:
    description: "root node for kg"
    required: true
    default: "root"
  push_branch:
    description: "Target branch name to push the index"
    required: true
    default: "gh-page"
  ref:
    description: "checkout-commit"
    required: true
    default: "main"
runs:
  using: "composite"
  steps:
  - uses: actions/checkout@v4
    with:
      repository: 'junxnone/autosidebar'
      path: 'script'
  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: '3.x'
      cache: 'pip'
  - name: Install dependencies
    shell: bash
    run: |
      python -m pip install --upgrade pip
      pip install -r script/requirements.txt
  - uses: actions/checkout@v4
    with:
      path: 'target'
      ref: ${{ inputs.ref }}
  - name: update sidebar and push
    shell: bash
    run: |
      cd target
      REMOTE=https://${{ inputs.GITHUB_TOKEN }}@github.com/${{ github.repository }}
      git config user.email "${{ inputs.actor }}@users.noreply.github.com"
      git config user.name "${{ inputs.actor }}"
      for i in 1 2 3 4 5; do
        python ../script/update_sidebar.py --path "${{ inputs.docs_path }}" --repo_name "${{ github.repository }}" --rname "${{ inputs.root_node }}" | tee "${{ inputs.docs_path }}"/_sidebar.md
        git add "${{ inputs.docs_path }}"
        git status
        if ! git commit -m "Update _sidebar"; then
          echo "nothing to commit"
          exit 0
        fi
        if git push "$REMOTE" "HEAD:${{ inputs.push_branch }}"; then
          exit 0
        fi
        echo "push rejected (attempt $i), fetching latest ${{ inputs.push_branch }} and retrying..."
        git fetch "$REMOTE" "${{ inputs.push_branch }}"
        git checkout -B "${{ inputs.push_branch }}" FETCH_HEAD
        sleep $((i * 3))
      done
      echo "::error::push to ${{ inputs.push_branch }} failed after retries"
      exit 1
